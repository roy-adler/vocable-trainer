services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - vocable-data:/data
    env_file:
      - .env
    # Pinned after env_file so host-side paths in .env can never point the
    # container away from the /data volume.
    environment:
      DATABASE_URL: file:/data/vocable.db
      DATA_DIR: /data
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: file:./ci.db
      DATA_DIR: /tmp/vocable-test-data

volumes:
  vocable-data:
